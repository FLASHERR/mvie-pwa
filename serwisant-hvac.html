<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Serwisant HVAC — Terminarz przeglądów</title>
<meta name="description" content="Lokalny CRM do zarządzania terminami przeglądów kotłów i pomp ciepła">

<!-- iOS: dodaj do ekranu głównego -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Serwisant">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e141b">
<link rel="apple-touch-icon" id="apple-icon">
<link rel="icon" id="fav-icon">
<link rel="manifest" id="app-manifest">

<style>
  :root{
    --bg:#0e141b;
    --surface:#161e27;
    --surface-2:#1d2733;
    --border:#2a3541;
    --text:#eef2f6;
    --text-dim:#8fa0b0;
    --accent:#ff6a35;
    --accent-dim:#ff6a3524;
    --green:#2fbf5f;
    --green-bg:#173321;
    --amber:#f0a831;
    --amber-bg:#3a2c11;
    --red:#ef4a4a;
    --red-bg:#3a1717;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --radius: 16px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }

  #app{ max-width:520px; margin:0 auto; min-height:100%; }

  /* ---------- Header / gauge strip (signature element) ---------- */
  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--bg) 70%, transparent);
    padding: calc(14px + env(safe-area-inset-top)) 16px 8px;
  }
  .h-row{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;}
  .h-title{ font-size:20px; font-weight:800; letter-spacing:-.02em; }
  .h-title span{ color:var(--accent); }
  .h-sub{ font-size:11px; color:var(--text-dim); font-family:var(--mono); text-transform:uppercase; letter-spacing:.06em;}

  .gauge{
    display:flex; border-radius:14px; overflow:hidden; border:1px solid var(--border);
    background:var(--surface);
  }
  .gauge-seg{
    flex:1; padding:10px 6px; text-align:center; position:relative;
    border-right:1px solid var(--border);
  }
  .gauge-seg:last-child{ border-right:none; }
  .gauge-num{ font-family:var(--mono); font-size:22px; font-weight:700; line-height:1; }
  .gauge-label{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin-top:4px; }
  .gauge-seg.g .gauge-num{ color:var(--green); }
  .gauge-seg.a .gauge-num{ color:var(--amber); }
  .gauge-seg.r .gauge-num{ color:var(--red); }
  .gauge-seg::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
  }
  .gauge-seg.g::before{ background:var(--green); }
  .gauge-seg.a::before{ background:var(--amber); }
  .gauge-seg.r::before{ background:var(--red); }

  /* ---------- Toolbar ---------- */
  .toolbar{ display:flex; gap:8px; overflow-x:auto; padding:12px 16px 4px; scrollbar-width:none; }
  .toolbar::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto; display:flex; align-items:center; gap:6px;
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:9px 13px; border-radius:100px; font-size:12.5px; font-weight:600;
    white-space:nowrap; cursor:pointer;
  }
  .chip:active{ background:var(--surface-2); }
  .chip.on{ border-color:var(--accent); color:var(--accent); background:var(--accent-dim); }

  .search-wrap{ padding:8px 16px 4px; }
  .search{
    width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:11px 14px; border-radius:12px; font-size:15px; font-family:var(--sans);
  }
  .search::placeholder{ color:var(--text-dim); }

  /* ---------- List ---------- */
  #list{ padding:10px 16px 20px; display:flex; flex-direction:column; gap:10px; }

  .empty{
    text-align:center; padding:60px 20px; color:var(--text-dim);
  }
  .empty b{ display:block; color:var(--text); font-size:16px; margin-bottom:6px; }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; position:relative; overflow:hidden;
  }
  .card::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
  }
  .card.g::before{ background:var(--green); }
  .card.a::before{ background:var(--amber); }
  .card.r::before{ background:var(--red); }
  .card.g{ background: linear-gradient(90deg, var(--green-bg), var(--surface) 18%); }
  .card.a{ background: linear-gradient(90deg, var(--amber-bg), var(--surface) 18%); }
  .card.r{ background: linear-gradient(90deg, var(--red-bg), var(--surface) 18%); }

  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:2px;}
  .c-name{ font-size:16.5px; font-weight:700; }
  .c-device{ font-size:13px; color:var(--text-dim); margin-top:2px; }
  .badge{
    font-family:var(--mono); font-size:11px; font-weight:700; padding:4px 8px; border-radius:8px;
    white-space:nowrap; flex:0 0 auto;
  }
  .badge.g{ color:var(--green); background:var(--green-bg); }
  .badge.a{ color:var(--amber); background:var(--amber-bg); }
  .badge.r{ color:var(--red); background:var(--red-bg); }

  .c-meta{ font-family:var(--mono); font-size:12px; color:var(--text-dim); margin-top:8px; }

  .card-actions{ display:flex; gap:8px; margin-top:12px; }
  .btn{
    border:none; border-radius:11px; padding:10px 12px; font-size:13px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; font-family:var(--sans);
  }
  .btn.call{ background:var(--green); color:#08210f; flex:1.3; text-decoration:none; }
  .btn.done{ background:var(--surface-2); color:var(--text); flex:1; border:1px solid var(--border); }
  .btn.icon{ background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border); flex:0 0 auto; width:40px; padding:0; }

  /* ---------- FAB ---------- */
  .fab{
    position:fixed; right:18px; bottom: calc(20px + env(safe-area-inset-bottom));
    width:58px; height:58px; border-radius:50%; background:var(--accent); color:#1a0900;
    border:none; font-size:28px; font-weight:400; box-shadow:0 8px 20px #ff6a3555;
    display:flex; align-items:center; justify-content:center; z-index:25; cursor:pointer;
  }

  /* ---------- Sheet / modal ---------- */
  .overlay{
    position:fixed; inset:0; background:#000000a0; z-index:40; opacity:0; pointer-events:none;
    transition:opacity .2s ease;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41; background:var(--surface);
    border-radius:20px 20px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    max-width:520px; margin:0 auto; transform:translateY(100%); transition:transform .25s cubic-bezier(.32,.72,0,1);
    max-height:88vh; overflow-y:auto; border-top:1px solid var(--border);
  }
  .overlay.open .sheet{ transform:translateY(0); }
  .sheet-handle{ width:36px; height:4px; background:var(--border); border-radius:4px; margin:0 auto 14px; }
  .sheet h2{ font-size:18px; margin:0 0 14px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; font-weight:600; }
  .field input, .field textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:12px 13px; border-radius:11px; font-size:16px; font-family:var(--sans);
  }
  .field textarea{ resize:vertical; min-height:60px; }
  .sheet-actions{ display:flex; gap:10px; margin-top:16px; }
  .btn.primary{ background:var(--accent); color:#1a0900; flex:1; padding:14px; font-size:15px; }
  .btn.ghost{ background:transparent; color:var(--text-dim); border:1px solid var(--border); padding:14px 16px; }
  .btn.danger-text{ background:transparent; color:var(--red); border:none; font-size:13px; padding:10px; margin-top:4px; width:100%; }

  input[type=file]{ display:none; }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px); z-index:60;
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:12px 18px; border-radius:12px; font-size:13.5px; opacity:0; transition:.25s ease; pointer-events:none;
    max-width:90%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce){
    .sheet, .overlay, .toast{ transition:none; }
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="h-row">
      <div>
        <div class="h-title">Serwis<span>ant</span> HVAC</div>
        <div class="h-sub">Terminarz przeglądów</div>
      </div>
    </div>
    <div class="gauge" id="gauge">
      <div class="gauge-seg g"><div class="gauge-num" id="cnt-g">0</div><div class="gauge-label">OK</div></div>
      <div class="gauge-seg a"><div class="gauge-num" id="cnt-a">0</div><div class="gauge-label">Zbliża się</div></div>
      <div class="gauge-seg r"><div class="gauge-num" id="cnt-r">0</div><div class="gauge-label">Po terminie</div></div>
    </div>
  </header>

  <div class="toolbar">
    <button class="chip" id="btn-notify">🔔 Powiadomienia: <span id="notify-status">wyłączone</span></button>
    <button class="chip" id="btn-export">⬇️ Eksport CSV</button>
    <button class="chip" id="btn-import">⬆️ Import CSV</button>
    <button class="chip" id="btn-install" style="display:none">📲 Zainstaluj</button>
    <input type="file" id="file-import" accept=".csv,text/csv">
  </div>

  <div class="search-wrap">
    <input class="search" id="search" type="search" placeholder="Szukaj po nazwisku lub urządzeniu…">
  </div>

  <div id="list"></div>
</div>

<button class="fab" id="fab-add" aria-label="Dodaj klienta">+</button>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <h2 id="sheet-title">Nowy klient</h2>
    <form id="client-form">
      <input type="hidden" id="f-id">
      <div class="field">
        <label for="f-name">Imię i nazwisko</label>
        <input id="f-name" type="text" required placeholder="Jan Kowalski" autocomplete="off">
      </div>
      <div class="field">
        <label for="f-phone">Numer telefonu</label>
        <input id="f-phone" type="tel" required placeholder="600 123 456" autocomplete="off">
      </div>
      <div class="field">
        <label for="f-device">Model urządzenia</label>
        <input id="f-device" type="text" required placeholder="np. Kocioł Termet, Pompa Panasonic">
      </div>
      <div class="field">
        <label for="f-date">Data montażu / ostatniego serwisu</label>
        <input id="f-date" type="date" required>
      </div>
      <div class="field">
        <label for="f-notes">Notatki (opcjonalnie)</label>
        <textarea id="f-notes" placeholder="Dostęp do kotłowni, kod do bramy, uwagi…"></textarea>
      </div>
      <div class="sheet-actions">
        <button type="button" class="btn ghost" id="btn-cancel">Anuluj</button>
        <button type="submit" class="btn primary">Zapisz</button>
      </div>
      <button type="button" class="btn danger-text" id="btn-delete" style="display:none">Usuń klienta</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* =========================================================
     STAŁE / KONFIGURACJA
  ========================================================= */
  var STORAGE_KEY   = "hvacCrm.clients.v1";
  var NOTIFY_KEY    = "hvacCrm.lastNotifyDate.v1";
  var DAY_MS        = 24 * 60 * 60 * 1000;
  var ORANGE_DAYS   = 335;  // ~11 miesięcy
  var RED_DAYS      = 365;  // ~12 miesięcy

  var els = {
    list: document.getElementById("list"),
    search: document.getElementById("search"),
    cntG: document.getElementById("cnt-g"),
    cntA: document.getElementById("cnt-a"),
    cntR: document.getElementById("cnt-r"),
    overlay: document.getElementById("overlay"),
    sheet: document.getElementById("sheet"),
    sheetTitle: document.getElementById("sheet-title"),
    form: document.getElementById("client-form"),
    fId: document.getElementById("f-id"),
    fName: document.getElementById("f-name"),
    fPhone: document.getElementById("f-phone"),
    fDevice: document.getElementById("f-device"),
    fDate: document.getElementById("f-date"),
    fNotes: document.getElementById("f-notes"),
    btnDelete: document.getElementById("btn-delete"),
    btnCancel: document.getElementById("btn-cancel"),
    fabAdd: document.getElementById("fab-add"),
    btnNotify: document.getElementById("btn-notify"),
    notifyStatus: document.getElementById("notify-status"),
    btnExport: document.getElementById("btn-export"),
    btnImport: document.getElementById("btn-import"),
    fileImport: document.getElementById("file-import"),
    btnInstall: document.getElementById("btn-install"),
    toast: document.getElementById("toast")
  };

  var state = { clients: [], filter: "" };

  /* =========================================================
     STORAGE
  ========================================================= */
  function loadClients(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      console.warn("Nie udało się odczytać danych, startuję z pustą bazą.", e);
      return [];
    }
  }

  function saveClients(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.clients));
  }

  function uid(){
    return "c_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
  }

  /* =========================================================
     LOGIKA STATUSU / DAT
  ========================================================= */
  function daysSince(dateStr){
    var last = new Date(dateStr + "T00:00:00");
    var now = new Date();
    var todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.floor((todayMid - last) / DAY_MS);
  }

  function getStatus(dateStr){
    var d = daysSince(dateStr);
    if (d > RED_DAYS)   return { level:"r", label:"Termin przekroczony", days:d };
    if (d >= ORANGE_DAYS) return { level:"a", label:"Zbliża się termin",  days:d };
    return { level:"g", label:"Aktualny",            days:d };
  }

  function formatDatePL(dateStr){
    var d = new Date(dateStr + "T00:00:00");
    if (isNaN(d)) return dateStr;
    var dd = String(d.getDate()).padStart(2,"0");
    var mm = String(d.getMonth()+1).padStart(2,"0");
    return dd + "." + mm + "." + d.getFullYear();
  }

  function todayISO(){
    var n = new Date();
    return n.getFullYear() + "-" + String(n.getMonth()+1).padStart(2,"0") + "-" + String(n.getDate()).padStart(2,"0");
  }

  function metaText(status){
    if (status.level === "r"){
      var over = status.days - RED_DAYS;
      return "Ostatni serwis " + status.days + " dni temu · po terminie o " + over + " dni";
    }
    if (status.level === "a"){
      var left = RED_DAYS - status.days;
      return "Ostatni serwis " + status.days + " dni temu · termin za " + left + " dni";
    }
    var toOrange = ORANGE_DAYS - status.days;
    return "Ostatni serwis " + status.days + " dni temu · kolejny przegląd za " + toOrange + " dni";
  }

  /* =========================================================
     RENDEROWANIE
  ========================================================= */
  function escapeHtml(str){
    return String(str == null ? "" : str)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function render(){
    var q = state.filter.trim().toLowerCase();
    var withStatus = state.clients.map(function(c){
      return { c: c, status: getStatus(c.lastServiceDate) };
    });

    // liczniki (zawsze liczone z pełnej bazy, niezależnie od filtra)
    var g=0, a=0, r=0;
    withStatus.forEach(function(x){
      if (x.status.level==="g") g++;
      else if (x.status.level==="a") a++;
      else r++;
    });
    els.cntG.textContent = g;
    els.cntA.textContent = a;
    els.cntR.textContent = r;

    var filtered = withStatus.filter(function(x){
      if (!q) return true;
      return (x.c.name || "").toLowerCase().indexOf(q) > -1 ||
             (x.c.device || "").toLowerCase().indexOf(q) > -1;
    });

    // sortowanie: najpierw czerwoni (najbardziej po terminie), potem pomarańczowi, potem zieloni
    var order = { r:0, a:1, g:2 };
    filtered.sort(function(x,y){
      if (order[x.status.level] !== order[y.status.level]) return order[x.status.level]-order[y.status.level];
      return y.status.days - x.status.days;
    });

    if (filtered.length === 0){
      els.list.innerHTML = state.clients.length === 0
        ? '<div class="empty"><b>Brak klientów</b>Dodaj pierwszego klienta przyciskiem + poniżej.</div>'
        : '<div class="empty"><b>Brak wyników</b>Nic nie pasuje do wyszukiwania.</div>';
      return;
    }

    var html = filtered.map(function(x){
      var c = x.c, s = x.status;
      var phoneHref = "tel:" + (c.phone || "").replace(/\s+/g,"");
      return (
        '<div class="card ' + s.level + '" data-id="' + c.id + '">' +
          '<div class="card-top">' +
            '<div><div class="c-name">' + escapeHtml(c.name) + '</div>' +
            '<div class="c-device">' + escapeHtml(c.device) + '</div></div>' +
            '<div class="badge ' + s.level + '">' + s.label + '</div>' +
          '</div>' +
          '<div class="c-meta">' + metaText(s) + ' · montaż/serwis: ' + formatDatePL(c.lastServiceDate) + '</div>' +
          '<div class="card-actions">' +
            '<a class="btn call" href="' + phoneHref + '">📞 Zadzwoń</a>' +
            '<button class="btn done" data-action="done" data-id="' + c.id + '">✓ Serwis dziś</button>' +
            '<button class="btn icon" data-action="edit" data-id="' + c.id + '">✎</button>' +
          '</div>' +
        '</div>'
      );
    }).join("");

    els.list.innerHTML = html;
  }

  /* =========================================================
     FORMULARZ / SHEET
  ========================================================= */
  function openSheet(){ els.overlay.classList.add("open"); }
  function closeSheet(){
    els.overlay.classList.remove("open");
    setTimeout(function(){ els.form.reset(); }, 200);
  }

  function openAdd(){
    els.sheetTitle.textContent = "Nowy klient";
    els.fId.value = "";
    els.fName.value = "";
    els.fPhone.value = "";
    els.fDevice.value = "";
    els.fDate.value = todayISO();
    els.fNotes.value = "";
    els.btnDelete.style.display = "none";
    openSheet();
    setTimeout(function(){ els.fName.focus(); }, 250);
  }

  function openEdit(id){
    var c = state.clients.find(function(x){ return x.id === id; });
    if (!c) return;
    els.sheetTitle.textContent = "Edytuj klienta";
    els.fId.value = c.id;
    els.fName.value = c.name;
    els.fPhone.value = c.phone;
    els.fDevice.value = c.device;
    els.fDate.value = c.lastServiceDate;
    els.fNotes.value = c.notes || "";
    els.btnDelete.style.display = "block";
    openSheet();
  }

  els.form.addEventListener("submit", function(e){
    e.preventDefault();
    var id = els.fId.value;
    var data = {
      name: els.fName.value.trim(),
      phone: els.fPhone.value.trim(),
      device: els.fDevice.value.trim(),
      lastServiceDate: els.fDate.value,
      notes: els.fNotes.value.trim()
    };
    if (!data.name || !data.phone || !data.device || !data.lastServiceDate){
      showToast("Uzupełnij wszystkie wymagane pola.");
      return;
    }
    if (id){
      var idx = state.clients.findIndex(function(x){ return x.id === id; });
      if (idx > -1) state.clients[idx] = Object.assign({}, state.clients[idx], data);
      showToast("Zapisano zmiany.");
    } else {
      data.id = uid();
      data.createdAt = new Date().toISOString();
      state.clients.push(data);
      showToast("Dodano klienta.");
    }
    saveClients();
    render();
    closeSheet();
  });

  els.btnDelete.addEventListener("click", function(){
    var id = els.fId.value;
    if (!id) return;
    if (!confirm("Usunąć tego klienta z bazy? Tej operacji nie można cofnąć.")) return;
    state.clients = state.clients.filter(function(x){ return x.id !== id; });
    saveClients();
    render();
    closeSheet();
    showToast("Klient usunięty.");
  });

  els.btnCancel.addEventListener("click", closeSheet);
  els.overlay.addEventListener("click", function(e){
    if (e.target === els.overlay) closeSheet();
  });
  els.fabAdd.addEventListener("click", openAdd);

  els.list.addEventListener("click", function(e){
    var btn = e.target.closest("[data-action]");
    if (!btn) return;
    var id = btn.getAttribute("data-id");
    var action = btn.getAttribute("data-action");
    if (action === "edit") openEdit(id);
    if (action === "done"){
      var c = state.clients.find(function(x){ return x.id === id; });
      if (!c) return;
      c.lastServiceDate = todayISO();
      saveClients();
      render();
      showToast("Zapisano wykonanie serwisu u: " + c.name);
    }
  });

  els.search.addEventListener("input", function(){
    state.filter = els.search.value;
    render();
  });

  /* =========================================================
     TOAST
  ========================================================= */
  var toastTimer = null;
  function showToast(msg){
    els.toast.textContent = msg;
    els.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ els.toast.classList.remove("show"); }, 2600);
  }

  /* =========================================================
     CSV — EKSPORT
  ========================================================= */
  var CSV_DELIM = ";"; // średnik — domyślny separator list w polskim Excelu

  function csvEscape(val){
    var str = String(val == null ? "" : val);
    if (str.indexOf(CSV_DELIM) > -1 || str.indexOf('"') > -1 || str.indexOf("\n") > -1 || str.indexOf("\r") > -1){
      return '"' + str.replace(/"/g, '""') + '"';
    }
    return str;
  }

  function exportCSV(){
    if (state.clients.length === 0){
      showToast("Baza jest pusta — nie ma czego eksportować.");
      return;
    }
    var header = ["ImieNazwisko","Telefon","ModelUrzadzenia","DataOstatniegoSerwisu","Notatki"];
    var lines = [header.join(CSV_DELIM)];
    state.clients.forEach(function(c){
      lines.push([
        csvEscape(c.name), csvEscape(c.phone), csvEscape(c.device),
        csvEscape(c.lastServiceDate), csvEscape(c.notes || "")
      ].join(CSV_DELIM));
    });
    var csvContent = "\uFEFF" + lines.join("\r\n"); // BOM -> poprawne polskie znaki w Excelu
    var blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "klienci_serwis_" + todayISO() + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast("Wyeksportowano " + state.clients.length + " klientów.");
  }

  /* =========================================================
     CSV — IMPORT
  ========================================================= */
  function parseCSV(text, delimiter){
    var rows = [];
    var row = [];
    var field = "";
    var inQuotes = false;
    for (var i=0; i<text.length; i++){
      var ch = text[i], next = text[i+1];
      if (inQuotes){
        if (ch === '"' && next === '"'){ field += '"'; i++; }
        else if (ch === '"'){ inQuotes = false; }
        else { field += ch; }
      } else {
        if (ch === '"'){ inQuotes = true; }
        else if (ch === delimiter){ row.push(field); field = ""; }
        else if (ch === "\r"){ /* ignoruj */ }
        else if (ch === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
        else { field += ch; }
      }
    }
    if (field.length > 0 || row.length > 0){ row.push(field); rows.push(row); }
    return rows.filter(function(r){ return !(r.length === 1 && r[0] === ""); });
  }

  function normalizeDate(raw){
    raw = (raw || "").trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
    var m = raw.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/); // DD.MM.YYYY / DD/MM/YYYY
    if (m) return m[3] + "-" + m[2].padStart(2,"0") + "-" + m[1].padStart(2,"0");
    return todayISO();
  }

  function importCSVFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      var text = String(reader.result || "");
      var headerLine = text.split(/\r?\n/)[0] || "";
      var delimiter = headerLine.indexOf(";") > -1 ? ";" : ",";
      var rows = parseCSV(text, delimiter);
      if (rows.length === 0){
        showToast("Plik CSV jest pusty.");
        return;
      }
      // pomiń wiersz nagłówka, jeśli wygląda jak nagłówek
      var first = rows[0].join("|").toLowerCase();
      var startIdx = (first.indexOf("imie") > -1 || first.indexOf("nazwisko") > -1 || first.indexOf("name") > -1) ? 1 : 0;

      var added = 0;
      for (var i = startIdx; i < rows.length; i++){
        var r = rows[i];
        if (!r || r.length === 0 || (r.length===1 && !r[0])) continue;
        var name   = (r[0] || "").trim();
        var phone  = (r[1] || "").trim();
        var device = (r[2] || "").trim();
        var date   = normalizeDate(r[3] || "");
        var notes  = (r[4] || "").trim();
        if (!name) continue;
        state.clients.push({
          id: uid(), name: name, phone: phone, device: device,
          lastServiceDate: date, notes: notes, createdAt: new Date().toISOString()
        });
        added++;
      }
      saveClients();
      render();
      showToast("Zaimportowano " + added + " klientów.");
    };
    reader.onerror = function(){ showToast("Nie udało się odczytać pliku."); };
    reader.readAsText(file, "UTF-8");
  }

  els.btnExport.addEventListener("click", exportCSV);
  els.btnImport.addEventListener("click", function(){ els.fileImport.click(); });
  els.fileImport.addEventListener("change", function(){
    var file = els.fileImport.files && els.fileImport.files[0];
    if (file) importCSVFile(file);
    els.fileImport.value = "";
  });

  /* =========================================================
     POWIADOMIENIA (Web Notifications API)
  ========================================================= */
  function updateNotifyChip(){
    if (!("Notification" in window)){
      els.notifyStatus.textContent = "niedostępne";
      els.btnNotify.disabled = true;
      return;
    }
    var perm = Notification.permission;
    els.notifyStatus.textContent = perm === "granted" ? "włączone" : (perm === "denied" ? "zablokowane" : "wyłączone");
    els.btnNotify.classList.toggle("on", perm === "granted");
  }

  function requestNotifyPermission(){
    if (!("Notification" in window)){
      showToast("Ta przeglądarka nie obsługuje powiadomień.");
      return;
    }
    if (Notification.permission === "denied"){
      showToast("Powiadomienia zablokowane w ustawieniach przeglądarki/telefonu.");
      return;
    }
    Notification.requestPermission().then(function(perm){
      updateNotifyChip();
      if (perm === "granted"){
        showToast("Powiadomienia włączone.");
        checkAndNotify(true);
      }
    });
  }

  els.btnNotify.addEventListener("click", requestNotifyPermission);

  // Sprawdza klientów przy starcie i wysyła powiadomienie push (max. 1x dziennie, by nie spamować).
  function checkAndNotify(force){
    if (!("Notification" in window) || Notification.permission !== "granted") return;

    var due = state.clients.filter(function(c){
      var lvl = getStatus(c.lastServiceDate).level;
      return lvl === "a" || lvl === "r";
    });
    if (due.length === 0) return;

    var last = localStorage.getItem(NOTIFY_KEY);
    if (!force && last === todayISO()) return; // już powiadomiono dzisiaj

    var overdue = due.filter(function(c){ return getStatus(c.lastServiceDate).level === "r"; }).length;
    var body = overdue > 0
      ? "Wymagany kontakt: " + due.length + " klientów czeka na serwis (w tym " + overdue + " po terminie)!"
      : "Wymagany kontakt: " + due.length + " klientów czeka na serwis!";

    try{
      var n = new Notification("Serwisant HVAC — przypomnienie", {
        body: body,
        tag: "hvac-due-reminder",
        renotify: true
      });
      n.onclick = function(){ window.focus(); n.close(); };
    }catch(e){ console.warn("Notification error", e); }

    localStorage.setItem(NOTIFY_KEY, todayISO());
  }

  /* =========================================================
     PWA — MANIFEST (Data URI) + IKONA + INSTALACJA
  ========================================================= */
  function buildIconDataUri(){
    var svg =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">' +
        '<rect width="192" height="192" rx="42" fill="#0e141b"/>' +
        '<rect x="7" y="7" width="178" height="178" rx="36" fill="none" stroke="#ff6a35" stroke-width="6"/>' +
        '<text x="96" y="132" font-size="104" text-anchor="middle" font-family="sans-serif">🔥</text>' +
      '</svg>';
    return "data:image/svg+xml," + encodeURIComponent(svg);
  }

  function setupPWA(){
    var iconUri = buildIconDataUri();
    document.getElementById("apple-icon").href = iconUri;
    document.getElementById("fav-icon").href = iconUri;

    var manifest = {
      name: "Serwisant HVAC — Terminarz przeglądów",
      short_name: "Serwisant HVAC",
      description: "Lokalny CRM do zarządzania terminami przeglądów kotłów i pomp ciepła.",
      start_url: ".",
      scope: ".",
      display: "standalone",
      background_color: "#0e141b",
      theme_color: "#0e141b",
      orientation: "portrait",
      icons: [
        { src: iconUri, sizes: "192x192", type: "image/svg+xml", purpose: "any" },
        { src: iconUri, sizes: "512x512", type: "image/svg+xml", purpose: "any" }
      ]
    };
    var manifestUri = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest));
    document.getElementById("app-manifest").href = manifestUri;
  }

  var deferredInstallPrompt = null;
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferredInstallPrompt = e;
    els.btnInstall.style.display = "flex";
  });
  els.btnInstall.addEventListener("click", function(){
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(function(){
      deferredInstallPrompt = null;
      els.btnInstall.style.display = "none";
    });
  });
  window.addEventListener("appinstalled", function(){
    showToast("Aplikacja zainstalowana ✓");
  });

  /* =========================================================
     INIT
  ========================================================= */
  function init(){
    state.clients = loadClients();
    setupPWA();
    updateNotifyChip();
    render();
    // opóźnienie, by nie blokować pierwszego renderu
    setTimeout(function(){ checkAndNotify(false); }, 1200);
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
